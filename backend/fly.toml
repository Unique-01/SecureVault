# fly.toml app configuration file generated for secure-vault on 2026-03-21T23:03:29+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'secure-vault'
primary_region = 'fra'

[build]

[deploy]
  release_command = 'sh release.sh'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[env]
  PORT = "8000"
  NODE_ENV = "production"
  API_HOST = "https://secure-vault.fly.dev/"
