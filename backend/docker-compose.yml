services:
  db:
    image: postgres:15-alpine
    container_name: secure_vault_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=secure_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d secure_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/secure_vault
    depends_on:
      db:
        condition: service_healthy  # waits for postgres to actually be ready

  app:
    build: .
    env_file:
      - .env
    container_name: secure_vault_app
    restart: always
    ports:
      - "${PORT}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/secure_vault
    depends_on:
      db:
        condition: service_healthy  # waits for postgres
      migrate:
        condition: service_completed_successfully  # waits for migrations to finish

volumes:
  postgres_data: